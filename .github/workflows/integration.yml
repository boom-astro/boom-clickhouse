name: ClickHouse integration demo

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clickhouse-demo-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: "2"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CH: ${{ github.workspace }}/.tools/clickhouse/clickhouse

jobs:
  adapter:
    name: Adapter and SQL correctness
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: boom-clickhouse
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node.js 24
        with:
          path: boom-clickhouse
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: boom-clickhouse/examples/boom -> target
      - name: Install verified ClickHouse release
        run: bash .github/scripts/install-clickhouse.sh "$(dirname "$CH")"
      - name: Format, lint, and unit tests
        run: |
          cargo fmt --manifest-path examples/boom/Cargo.toml --check
          rustfmt --edition 2021 --check examples/boom/boom_example.rs
          cargo clippy --locked --manifest-path examples/boom/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path examples/boom/Cargo.toml
          cargo build --locked --manifest-path examples/boom/Cargo.toml
      - name: Raw schema and incremental bin checks
        run: python3 bin/check.py
      - name: HTTP integration demonstration
        env:
          DEMO_ARTIFACTS: ${{ runner.temp }}/adapter-demo
        run: python3 examples/boom/tests/integration.py
      - name: Publish demonstration summary
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/adapter-demo/demo.md" ]; then
            cat "$RUNNER_TEMP/adapter-demo/demo.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, Node.js 24
        if: always()
        with:
          name: adapter-demo
          path: ${{ runner.temp }}/adapter-demo
          if-no-files-found: ignore

  boom:
    name: Real BOOM ZTF types
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: boom-clickhouse
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node.js 24
        with:
          path: boom-clickhouse
          persist-credentials: false
      # The example belongs to this PR; BOOM provides only its real public types.
      # No matching BOOM branch or cross-repository token is needed.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node.js 24
        with:
          repository: boom-astro/boom
          ref: 1a39dcc3c403c6cc8533dfad862c1eac2c62a088
          path: boom
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            boom -> target
            boom-clickhouse/examples/boom -> target
          key: boom-types
      - name: Install BOOM build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libsasl2-dev libcfitsio-dev libkrb5-dev cmake clang pkg-config libssl-dev
      - name: Install verified ClickHouse release
        run: bash .github/scripts/install-clickhouse.sh "$(dirname "$CH")"
      - name: Build the adapter and BOOM example
        run: |
          cargo build --locked --manifest-path examples/boom/Cargo.toml
          mkdir -p ../boom/examples
          cp examples/boom/boom_example.rs ../boom/examples/clickhouse_shadow.rs
          cargo build --locked --manifest-path ../boom/Cargo.toml --example clickhouse_shadow
      - name: End-to-end writes and typed readback through BOOM
        env:
          DEMO_ARTIFACTS: ${{ runner.temp }}/boom-demo
        run: |
          export BOOM_ADAPTER="$PWD/../boom/target/debug/examples/clickhouse_shadow"
          python3 examples/boom/tests/integration.py
      - name: Publish BOOM demonstration summary
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/boom-demo/demo.md" ]; then
            cat "$RUNNER_TEMP/boom-demo/demo.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, Node.js 24
        if: always()
        with:
          name: boom-types-demo
          path: ${{ runner.temp }}/boom-demo
          if-no-files-found: ignore

  proposal:
    name: Real alerts, durable delivery, and parity
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: boom-clickhouse
    services:
      mongo:
        image: mongo:8.2
        env:
          MONGO_INITDB_ROOT_USERNAME: shadow
          MONGO_INITDB_ROOT_PASSWORD: shadow-test-only
        ports:
          - 37117:27017
        options: >-
          --health-cmd "mongosh --quiet --username shadow --password shadow-test-only --authenticationDatabase admin --eval 'db.adminCommand({ping:1}).ok'"
          --health-interval 2s --health-timeout 5s --health-retries 30
      redis:
        image: redis:7-alpine
        ports:
          - 37179:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: boom-clickhouse
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mcoughlin/boom
          lfs: true
          ref: 004ab6c00c104edc8c5de0f6bcd09e796c3590cf
          path: boom
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: boom -> target
          key: boom-shadow-proposal
      - name: Install BOOM build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libsasl2-dev libcfitsio-dev libkrb5-dev cmake clang pkg-config libssl-dev
      - name: Install CPU ONNX Runtime
        run: |
          python3 -m pip install onnxruntime==1.24.4
          python3 - <<'PYORT'
          import os
          import pathlib
          import onnxruntime
          capi = pathlib.Path(onnxruntime.__file__).parent / "capi"
          library = next(capi.glob("libonnxruntime.so.*"))
          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write(f"ORT_DYLIB_PATH={library}\n")
          PYORT
      - name: Install verified ClickHouse release
        run: bash .github/scripts/install-clickhouse.sh "$(dirname "$CH")"
      - name: Build and check the native worker proposal
        run: |
          cargo fmt --manifest-path ../boom/Cargo.toml --all --check
          python3 -m unittest discover -s examples/boom/tests -p 'test_*.py'
          cargo test --locked --manifest-path ../boom/Cargo.toml --lib photometry::
          cargo test --locked --manifest-path ../boom/Cargo.toml --example photometry_benchmark
          cargo build --locked --manifest-path ../boom/Cargo.toml --example photometry_shadow_replay --example photometry_filter_audit --example photometry_benchmark
          make -C ../boom check-configs
          git -C ../boom diff --exit-code -- config/prod
      - name: Replay real Avro packets through Redis, MongoDB, and ClickHouse
        env:
          DEMO_ARTIFACTS: ${{ runner.temp }}/proposal-demo
        run: python3 examples/boom/tests/proposal.py
      - name: Benchmark baseline, shadow delivery, recovery, and CPU enrichment
        env:
          DEMO_ARTIFACTS: ${{ runner.temp }}/benchmark-demo
        run: |
          docker exec "${{ job.services.redis.id }}" redis-cli FLUSHALL
          python3 examples/boom/tests/benchmark.py --objects 32 --epochs 4 --interval-ms 30 --recovery-overlap --enrichment-samples 16
      - name: Verify corrected, deduplicated photometry bins
        env:
          DEMO_ARTIFACTS: ${{ runner.temp }}/bin-demo
        run: python3 examples/boom/tests/binning.py
      - name: Publish proposal evidence
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/proposal-demo/demo.md" ]; then
            cat "$RUNNER_TEMP/proposal-demo/demo.md" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f "$RUNNER_TEMP/bin-demo/bins.md" ]; then
            cat "$RUNNER_TEMP/bin-demo/bins.md" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f "$RUNNER_TEMP/benchmark-demo/decision.md" ]; then
            cat "$RUNNER_TEMP/benchmark-demo/decision.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: real-alert-proposal
          path: ${{ runner.temp }}/proposal-demo
          if-no-files-found: ignore
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: corrected-photometry-bins
          path: ${{ runner.temp }}/bin-demo
          if-no-files-found: ignore
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: real-alert-benchmark
          path: ${{ runner.temp }}/benchmark-demo
          if-no-files-found: ignore
