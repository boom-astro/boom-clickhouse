services:
  mongo:
    image: mongo:8.2
    environment:
      MONGO_INITDB_ROOT_USERNAME: shadow
      MONGO_INITDB_ROOT_PASSWORD: shadow-test-only
    ports:
      - "127.0.0.1:37117:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--username", "shadow", "--password", "shadow-test-only", "--authenticationDatabase", "admin", "--eval", "db.adminCommand({ping:1}).ok"]
      interval: 2s
      timeout: 5s
      retries: 30
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:37179:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 30
